name: Test With Libraries

on:
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # الخطوة الجديدة: تثبيت مكتبتين خفيفتين
      - name: Install dependencies
        run: |
          python -m pip install requests Pillow

      # تعديل الأمر لاختبار المكتبات
      - name: Run script with libraries
        run: python -c "
import requests
import PIL
print('Successfully imported requests and Pillow!')
print('Requests version:', requests.__version__)
print('Pillow version:', PIL.__version__)
"
