name: Video Editor Workflow

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick python3-tk fonts-dejavu-core libavformat-dev libavcodec-dev libavdevice-dev libavfilter-dev libswscale-dev libswreserve-dev

      - name: Create virtual environment
        run: python3.10 -m venv venv

      - name: Install Python dependencies in venv
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install numpy==1.23.5
          pip install imageio==2.27.0
          pip install imageio-ffmpeg==0.4.8
          pip install tqdm==4.66.1
          pip install decorator==5.1.1
          pip install moviepy==1.0.3
          pip install requests
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
          pip install Pillow==9.5.0
          pip list

      - name: Verify moviepy installation
        run: |
          source venv/bin/activate
          python -c "import moviepy.editor; print('MoviePy installed successfully')"

      - name: Run Video Editor Script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          source venv/bin/activate
          python video_editor.py
        continue-on-error: true

      - name: Check if video file exists
        id: check_files
        run: |
          if [ -f "final_video.mp4" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "File size: $(stat -c%s final_video.mp4) bytes"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Current directory contents:"
            ls -la
          fi

      - name: Upload Video Artifact
        if: steps.check_files.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_video.mp4

      - name: Debug if video not found
        if: steps.check_files.outputs.exists == 'false'
        run: |
          echo "Video file not found. Listing current directory:"
          ls -la
          echo "Looking for any .mp4 files:"
          find . -name "*.mp4" -type f
          echo "Checking for any video files:"
          find . -type f \( -name "*.mp4" -o -name "*.mov" -o -name "*.avi" \)
          echo "Checking script logs:"
          if [ -f "script.log" ]; then
            cat script.log
          fi

      - name: Check script exit code
        if: always()
        run: |
          echo "Script exit code: ${{ steps.run-script.outcome }}"
          echo "Job status: ${{ job.status }}"
